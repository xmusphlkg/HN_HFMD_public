name: synthetic-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: synthetic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      LC_ALL: C.UTF-8
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      R_LIBS_USER: ${{ github.workspace }}/.r_library

    steps:
      - name: Check out public-safe source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5

      - name: Install R 4.5.0
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: 4.5.0
          use-public-rspm: true

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          version: 0.11.29

      - name: Install and verify the declared font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core
          fc-match -f '%{family}\n' 'DejaVu Sans' | grep -F 'DejaVu Sans'

      - name: Synchronize the locked public environment
        run: uv sync --locked --extra analysis --extra workflow --extra dev

      - name: Restore the locked R environment
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          install.packages(
            "https://cloud.r-project.org/src/contrib/Archive/renv/renv_1.2.3.tar.gz",
            repos = NULL,
            lib = Sys.getenv("R_LIBS_USER")
          )
          renv::restore(
            lockfile = "Script_r/renv.lock",
            library = Sys.getenv("R_LIBS_USER"),
            prompt = FALSE
          )

      - name: Assert restricted inputs are absent
        run: |
          test ! -e Data
          test ! -e AnalysisData/restricted

      - name: Test Python and R contracts
        run: |
          uv run --locked pytest --cov=hfmd --cov-report=term-missing
          Rscript Script_r/tests/test_visual_contract.R
          Rscript Script_r/tests/test_graphical_abstract.R

      - name: Run and validate the complete two-core synthetic DAG
        run: |
          uv run --locked hfmd run \
            --target all \
            --profile ci \
            --run-id 20000101T000000Z-00000000-ci-e2e
          uv run --locked hfmd validate \
            --run 20000101T000000Z-00000000-ci-e2e

      - name: Exercise clean-history public export
        run: |
          uv run --locked python public_repo/export_public.py "$RUNNER_TEMP/hfmd-public"
          test "$(git -C "$RUNNER_TEMP/hfmd-public" rev-list --count HEAD)" = "1"
          test -z "$(git -C "$RUNNER_TEMP/hfmd-public" remote)"
          test -z "$(git -C "$RUNNER_TEMP/hfmd-public" status --porcelain)"
          test ! -e "$RUNNER_TEMP/hfmd-public/Data"
          test ! -e "$RUNNER_TEMP/hfmd-public/AnalysisData/restricted"
