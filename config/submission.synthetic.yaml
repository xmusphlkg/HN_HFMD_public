journal: Epidemics
title: "Synthetic validation only: auditable multiscale HFMD workflow"
abstract: >-
  This generated document validates a reproducible reporting workflow using
  wholly synthetic records for fictional regions. It exercises hash-linked
  data, analysis, figure, claim, manuscript and submission contracts. No
  formal epidemiological model is fitted, no Hunan surveillance result is
  reported, and the package is not suitable for journal submission or
  scientific inference.
keywords:
  - synthetic validation
  - reproducible workflow
  - HFMD
  - EV-A71
highlights:
  - "Synthetic records exercise one hash-linked reporting workflow"
  - "Five main and ten supplementary figure contracts are validated"
  - "No formal model or scientific conclusion is produced"
