sensitivity_families:
  - family_id: legacy_structural_scenarios
    purpose: Preserve the twenty existing structural sensitivities as candidate evidence only
    implementation_status: migrated
    values: [reporting_0.01, reporting_0.10, cross_duration_3.31w, cross_duration_23.4w, cross_strength_fixed_0.37, cross_strength_fixed_0.68, cross_strength_fixed_0.96, homologous_half_life_104w, homologous_half_life_520w, generation_one_week, generation_three_week, coverage_r10, coverage_r25, coverage_r50, vaccine_efficacy_low, vaccine_efficacy_high, population_minus_10pct, population_plus_10pct, typed_ev_overascertain_1.5, typed_ev_underascertain_0.67]
  - family_id: typing_selection
    purpose: Two-stage entry-to-testing and resolvable-typing selection correction
    implementation_status: required
    values: [unadjusted, truncated_ipw, standardized, nonsevere_only, adequately_typed_periods_and_areas]
    requirements: [model testing entry, model resolvable result conditional on testing, report positivity, report weight distribution, report effective sample size]
    parameters: {covariates: [age, county, time_smooth, severity, confirmation_status, period_interactions]}
  - family_id: typing_trailing_window
    purpose: Assess temporal borrowing in reconstructed pathogen shares
    implementation_status: required
    values: [4, 8, 13, 26]
    parameters: {unit: weeks}
  - family_id: typing_dirichlet_prior_mass
    purpose: Assess prior influence on pathogen composition
    implementation_status: required
    values: [1, 5, 20]
  - family_id: secular_trends
    purpose: Compare M1 and M2 under identical pathogen-specific secular trends
    implementation_status: required
    values: [six_df_smooth, post2017_step, post2017_slope, post2017_step_and_slope]
    requirements: [fit paired M1 and M2 specifications, report total and typing likelihood components by year]
  - family_id: epidemic_disturbance
    purpose: Separate pathogen-specific pandemic disturbance and rebound from interaction
    implementation_status: required
    values: [pathogen_specific_2020_2022, pathogen_specific_2023_rebound]
  - family_id: placebo_rollout
    purpose: Detect spurious vaccine-era interaction selection
    implementation_status: required
    values: [2014, 2015, 2016, 2018, 2019, 2020]
  - family_id: rolling_origin_validation
    purpose: Seven annual out-of-period comparisons using joint and component log scores
    implementation_status: required
    values: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
    requirements: [joint log score, total-case log score, typing log score]
  - family_id: bootstrap_uncertainty
    purpose: Separate conditional parameter uncertainty from regenerated full-state uncertainty
    implementation_status: required
    values: [conditional_2000, full_state_minimum_500]
    requirements: [four starts for ten percent of full-state replicates, adaptive batches of 250, maximum 2000]
  - family_id: mechanism_recovery_simulation
    purpose: Quantify false selection, bias, and interval coverage under known mechanisms
    implementation_status: required
    values: [zero_cross_protection, secular_trend, time_varying_typing, epidemic_disturbance, pathogen_pair_structures, positive_mechanism]
  - family_id: contact_structure
    purpose: Test dependence on age mixing assumptions
    implementation_status: required
    values: [current_contact_matrix, proportional_mixing, assortativity_reduced_50pct, alternative_china_contact_matrix]
  - family_id: age_exposure_structure
    purpose: Test age susceptibility, initialization, vaccine eligibility, infant weighting, and asymmetric protection duration
    implementation_status: required
    values: [regularized_age_susceptibility, initialization_immunity, warmup, vaccine_eligibility, infant_weight, asymmetric_cross_duration]
  - family_id: numerical_truncation_audit
    purpose: Make stabilization caps visible for every formal scenario
    implementation_status: required
    values: [relative_risk, infection, force_of_infection, susceptibility]
    requirements: [report trigger count for every fitted scenario]
