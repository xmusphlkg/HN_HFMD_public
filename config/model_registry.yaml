schema_version: "1.0.0"
expected_counts:
  ecological: 55
  dynamics: 17

formula_templates:
  weekly_count:
    "{response} ~ {exposure} + week_sin1 + week_cos1 + week_sin2 + week_cos2 + week_sin3 + week_cos3 + C(county_code) + C(calendar_year)"
  weekly_county_trend:
    "{response} ~ {exposure} + week_sin1 + week_cos1 + week_sin2 + week_cos2 + week_sin3 + week_cos3 + C(county_code) + C(calendar_year) + C(county_code):analysis_time_years"
  weekly_weather:
    "{response} ~ {exposure} + weather_temperature_cb_b1_lag_intercept + weather_temperature_cb_b2_lag_intercept + weather_temperature_cb_b3_lag_intercept + weather_temperature_cb_b1_lag_linear + weather_temperature_cb_b2_lag_linear + weather_temperature_cb_b3_lag_linear + weather_relative_humidity_lag0_2_b1 + weather_relative_humidity_lag0_2_b2 + weather_relative_humidity_lag0_2_b3 + weather_log1p_precipitation_lag0_2_b1 + weather_log1p_precipitation_lag0_2_b2 + weather_log1p_precipitation_lag0_2_b3 + week_sin1 + week_cos1 + week_sin2 + week_cos2 + week_sin3 + week_cos3 + C(county_code) + C(calendar_year)"
  weekly_weather_county_trend:
    "{response} ~ {exposure} + weather_temperature_cb_b1_lag_intercept + weather_temperature_cb_b2_lag_intercept + weather_temperature_cb_b3_lag_intercept + weather_temperature_cb_b1_lag_linear + weather_temperature_cb_b2_lag_linear + weather_temperature_cb_b3_lag_linear + weather_relative_humidity_lag0_2_b1 + weather_relative_humidity_lag0_2_b2 + weather_relative_humidity_lag0_2_b3 + weather_log1p_precipitation_lag0_2_b1 + weather_log1p_precipitation_lag0_2_b2 + weather_log1p_precipitation_lag0_2_b3 + week_sin1 + week_cos1 + week_sin2 + week_cos2 + week_sin3 + week_cos3 + C(county_code) + C(calendar_year) + C(county_code):analysis_time_years"
  weekly_urbanization:
    "{response} ~ {exposure} + urbanization_lag1_10pp_within + week_sin1 + week_cos1 + week_sin2 + week_cos2 + week_sin3 + week_cos3 + C(county_code) + C(calendar_year)"
  season_outbreak:
    "season_any_recorded_outbreak ~ {exposure} + {between_clause}log_prior_year_cases + log_prior_year_events + C(season) + C({geography}) + C(calendar_year)"
  ignition:
    "{response} ~ {exposure_terms} + log_prior_cases + log_prior_cases_sq + prior_target_age_share + prior_cases_zero + week_sin1 + week_cos1 + week_sin2 + week_cos2 + week_sin3 + week_cos3 + C({geography}) + C(calendar_year)"
  age_composition:
    "{successes} + {failures} ~ vax_lag1_log2_within + week_sin1 + week_cos1 + week_sin2 + week_cos2 + week_sin3 + week_cos3 + C(county_code) + C(calendar_year)"
  severe_composition:
    "severe_cases + nonsevere_known_cases ~ vax_lag1_log2_within * C(target_age) + month_sin + month_cos + C(county_code) + C(calendar_year)"
  pathogen_composition:
    "EV_A71 + typed_non_ev_a71 ~ vax_lag1_log2_within + quarter_sin + quarter_cos + C(county_code) + C(calendar_year){typing_adjustment}"
  event:
    "{response} ~ {exposure_terms} + C(setting_group) + month_sin + month_cos + C({geography}) + C(event_year)"

models:
  # Primary ecological outcomes (six prespecified estimands).
  - model_id: background_nb2_primary
    line: ecological
    group: primary_outcomes
    outcome: reported_cases
    estimand: Within-county association between prior-year vaccine records and weekly reported HFMD burden
    family: NB2
    effect_scale: IRR
    implementation_status: migrated
    formula_ref: weekly_count
    formula_args: {response: reported_cases, exposure: vax_lag1_log2_within}
    primary: true
  - model_id: season_outbreak_risk_primary
    line: ecological
    group: primary_outcomes
    outcome: season_any_recorded_outbreak
    estimand: County-season association with at least one recorded legacy-definition event
    family: Binomial-cloglog
    effect_scale: HR
    implementation_status: migrated
    formula_ref: season_outbreak
    formula_args: {exposure: vax_lag1_log2_within, between_clause: "vax_lag1_between_z + ", geography: city_code}
    primary: true
  - model_id: ignition_cloglog_primary
    line: ecological
    group: primary_outcomes
    outcome: recognized_outbreak_week
    estimand: Conditional weekly initiation of a recorded legacy-definition event
    family: Binomial-cloglog
    effect_scale: HR
    implementation_status: migrated
    formula_ref: ignition
    formula_args: {response: recognized_outbreak_week, exposure_terms: "vax_lag1_log2_within + vax_lag1_between_z", geography: city_code}
    primary: true
  - model_id: age_target_composition_primary
    line: ecological
    group: primary_outcomes
    outcome: target_age_case_share
    estimand: Share of known-age cases aged six months to five years
    family: Binomial-logit
    effect_scale: OR
    implementation_status: migrated
    formula_ref: age_composition
    formula_args: {successes: target_age_cases, failures: non_target_age_cases}
    primary: true
  - model_id: pathogen_ev71_typed_primary
    line: ecological
    group: primary_outcomes
    outcome: ev_a71_typed_share
    estimand: EV-A71 share among typed HFMD cases, conditional on testing and resolvable typing
    family: Binomial-logit
    effect_scale: OR
    implementation_status: migrated
    formula_ref: pathogen_composition
    formula_args: {typing_adjustment: ""}
    primary: true
  - model_id: event_size_nb2_primary
    line: ecological
    group: primary_outcomes
    outcome: reported_event_cases
    estimand: Reported cases per positive source-recorded event
    family: NB2
    effect_scale: IRR
    implementation_status: migrated
    formula_ref: event
    formula_args: {response: reported_event_cases, exposure_terms: "vax_lag1_log2_within + vax_lag1_between_z", geography: city_code}
    primary: true

